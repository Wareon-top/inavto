  <style>

    .brand{padding:2px 8px 22px;display:grid;grid-template-columns:28px 1fr;column-gap:6px;align-items:center}.brand-mark{width:27px;height:31px;position:relative;display:block}.brand-mark:before,.brand-mark:after{content:"";position:absolute;transform:skew(-26deg);border:3px solid #ee3851;border-bottom:0}.brand-mark:before{left:8px;top:0;width:10px;height:22px}.brand-mark:after{left:2px;top:8px;width:10px;height:20px;border-color:#178be7}.brand-name{font-size:15px;line-height:1;font-weight:800;white-space:nowrap}.brand-name b{color:#e84255}.brand-sub{grid-column:2;font-size:7.5px;color:#d2deea;margin-top:-8px;white-space:nowrap}

    .workspace{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);padding:0 18px;display:flex;align-items:center;gap:14px}.page-title{font-size:24px;font-weight:850;letter-spacing:-.4px;min-width:225px}.new-button,.primary{border:0;border-radius:4px;background:linear-gradient(180deg,#0c8bf9,#0576e6);color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(0,118,230,.2)}.new-button{padding:10px 18px;white-space:nowrap}.search-wrap{width:305px;position:relative}.search-wrap svg{position:absolute;width:16px;height:16px;left:12px;top:50%;transform:translateY(-50%);stroke:#7d8a98;fill:none}.search{width:100%;height:38px;border:1px solid #dfe5ec;border-radius:4px;padding:0 12px 0 36px;outline:0;background:#fff}.search:focus{border-color:#6aafea;box-shadow:0 0 0 3px rgba(8,124,240,.1)}.top-spacer{flex:1}.avatar{width:32px;height:32px;border-radius:50%;background:#173d65;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}.user{font-size:12px;font-weight:750}.logout{border:0;background:transparent;color:#52677b;font-size:17px;padding:8px}

    table{width:100%;border-collapse:collapse;font-size:11px}thead{background:#f8fbfe}th{height:47px;color:#32485d;font-size:9.5px;text-align:left;font-weight:750;padding:0 11px;border-bottom:1px solid var(--line);white-space:nowrap}td{height:51px;padding:0 11px;border-bottom:1px solid #edf1f4;white-space:nowrap}tr.item-row{cursor:pointer;transition:.12s background}tr.item-row:hover{background:#f3f8fd}tr.item-row.selected{background:#cbe8ff}.number{color:#086fcf;font-weight:850}.pill{display:inline-block;border-radius:13px;padding:5px 10px;font-size:10px;font-weight:750}.pill.yes{background:#d9f7e7;color:#15854c}.pill.no{background:#ffe3e6;color:#bf394b}.status-new{background:#d9ecff;color:#126dc2}.status-working{background:#fff0c9;color:#9b6a00}.status-found{background:#dbf6e6;color:#168051}.status-closed{background:#e7ebef;color:#526270}.empty{padding:45px;text-align:center;color:var(--muted)}
    .detail{position:sticky;top:0;height:calc(100vh - 71px);background:#fff;display:flex;flex-direction:column;min-width:0}.detail-head{min-height:60px;padding:12px 16px;display:flex;align-items:center;gap:9px}.detail-head h2{font-size:18px;margin:0;white-space:nowrap}.detail-head .edit{margin-left:auto;padding:9px 12px}.icon-button{border:0;background:transparent;width:32px;height:32px;display:grid;place-items:center;color:#607386;border-radius:4px}.icon-button:hover{background:#eef4f8}.icon-button svg,.edit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px}.detail-scroll{padding:0 16px 92px;overflow:auto;flex:1}.info-grid{display:grid;grid-template-columns:44% 56%;row-gap:11px;font-size:11.5px}.info-grid span{color:#6f7f8f}.info-grid strong{font-weight:760}.status-select{border:1px solid #dce4eb;border-radius:4px;padding:6px 28px 6px 8px;color:#126ec4;font-weight:750;background:#fff}.divider{height:1px;background:var(--line);margin:15px -16px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px;font-size:12px;font-weight:850}.add-media{border:1px solid #d7e1ea;background:#fff;color:#0876db;padding:7px 9px;border-radius:3px;font-size:10px;font-weight:700}
    .media-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.video-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.media{height:54px;border:1px solid #dce4eb;border-radius:4px;background:#f4f7fa;overflow:hidden;position:relative;padding:0}.video-grid .media{height:70px}.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}.media .remove{position:absolute;right:3px;top:3px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(11,35,56,.82);color:#fff;font-size:13px;line-height:20px;padding:0}.media.more,.media.add-tile{display:grid;place-items:center;color:#607386;background:#fbfcfd}.note{min-height:64px;border:1px solid #e2e8ee;border-radius:4px;padding:9px 10px;font-size:11px;line-height:1.45;white-space:pre-wrap}.note-yellow{background:#fff9dc!important}.note-blue{background:#eaf5ff!important}.note-green{background:#eaf9ef!important}.note-pink{background:#fff0f3!important}.note-violet{background:#f3efff!important}
    .detail-foot{position:absolute;bottom:0;left:0;right:0;height:77px;padding:14px 16px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.delete{border:0;background:transparent;color:#26384a;font-size:11px;padding:9px 0}.delete svg{width:15px;height:15px;stroke:currentColor;fill:none;vertical-align:-3px;margin-right:5px}.primary{min-width:158px;padding:11px 17px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field span{font-size:10px;color:#6f7f8f;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4eb;border-radius:4px;padding:8px 9px;outline:0;background:#fff;color:var(--text)}.field textarea{min-height:77px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#5aa9ec;box-shadow:0 0 0 3px rgba(8,124,240,.09)}.colors{display:flex;gap:8px;margin-top:9px}.color-choice{width:24px;height:24px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #ccd6df}.color-choice.active{box-shadow:0 0 0 2px #087cf0}.color-choice[data-color=yellow]{background:#ffe783}.color-choice[data-color=blue]{background:#aedaff}.color-choice[data-color=green]{background:#a9e7be}.color-choice[data-color=pink]{background:#ffb8c5}.color-choice[data-color=violet]{background:#cab7ff}
    .settings{padding:24px;display:grid;grid-template-columns:repeat(2,minmax(260px,420px));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:20px;box-shadow:var(--shadow)}.card h2{font-size:17px;margin:0 0 8px}.card p{color:var(--muted);font-size:12px;line-height:1.5}.language{display:flex;gap:8px}.language button{border:1px solid #dce4eb;background:#fff;padding:8px 12px;border-radius:4px}.language button.active{background:#e7f3ff;border-color:#69b2f2;color:#0872d3}
    .login{position:fixed;inset:0;background:linear-gradient(145deg,#0b2946,#0d416c);display:grid;place-items:center;padding:20px}.login-card{width:min(380px,100%);background:#fff;border-radius:10px;padding:27px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.login-card h1{margin:0 0 6px;font-size:23px}.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}.login-card input{width:100%;height:43px;border:1px solid #d7e0e8;border-radius:5px;padding:0 12px;margin-bottom:10px}.login-card button{width:100%;height:43px}.toast{position:fixed;right:20px;bottom:20px;z-index:10;background:#173b5d;color:#fff;padding:11px 15px;border-radius:5px;font-size:12px;box-shadow:var(--shadow)}.lightbox{position:fixed;inset:0;z-index:20;background:rgba(3,18,31,.88);display:grid;place-items:center;padding:30px}.lightbox img,.lightbox video{max-width:92vw;max-height:88vh;border-radius:5px}.lightbox button{position:absolute;right:20px;top:20px;background:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:22px}
    @media(max-width:1000px){.layout{grid-template-columns:minmax(560px,1fr) 380px}.page-title{min-width:160px}.search-wrap{width:240px}}
    @media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;flex-direction:row;align-items:center;padding:7px}.brand{padding:0;width:45px}.brand-name,.brand-sub,.side-foot,.side-spacer{display:none}.nav{display:flex;flex:1}.nav button{justify-content:center;flex:1}.top{height:auto;min-height:62px;flex-wrap:wrap;padding:10px}.page-title{min-width:auto}.search-wrap{order:4;width:100%}.user{display:none}.content{padding:0}.layout{display:block}.detail{position:fixed;z-index:5;inset:0;height:100vh}.media-grid{grid-template-columns:repeat(4,1fr)}th,td{padding:0 8px}.list-panel{overflow:auto}}
  </style>

<body>
  <div id="login" class="login">
    <form id="loginForm" class="login-card">
      <h1>INAVTO ASIA</h1><p id="loginText">Личный учёт работы</p>
      <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Код доступа" required>
      <button class="primary" id="loginButton">Войти</button><p id="loginError" style="color:#bd3246;margin-top:10px"></p>
    </form>
  </div>
  <div id="app"></div><div id="toast" class="toast hidden"></div><div id="lightbox"></div>
  <script>
    const I={
      ru:{requests:'Заявки',archive:'Архив',settings:'Настройки',tagline:'Просто.\\nУдобно.\\nДля работы.',newRequest:'+ Новая заявка',search:'Поиск по марке...',request:'Заявка',newTitle:'Новая заявка',edit:'Редактировать',save:'Сохранить',delete:'Удалить',date:'Дата',brand:'Марка автомобиля',condition:'Состояние',year:'Год',color:'Цвет',available:'В наличии',status:'Статус',yes:'Да',no:'Нет',newCar:'Новый',used:'С пробегом',photos:'Фото',videos:'Видео',addPhoto:'+ Добавить фото',addVideo:'+ Добавить видео',note:'Заметка',noteColor:'Цвет заметки',empty:'Заявок пока нет',saved:'Заявка сохранена',deleted:'Заявка удалена',uploaded:'Вложение добавлено',access:'Код доступа',signIn:'Войти',loginText:'Личный учёт работы',logout:'Выйти',language:'Язык интерфейса',languageHelp:'Переводит только интерфейс; ваши записи остаются без изменений.',security:'Личный доступ',securityHelp:'Эта система не получает заявки с сайта и использует отдельные таблицы учёта.',confirmDelete:'Удалить заявку вместе с фото и видео?',statusNames:{new:'Новая',working:'В работе',found:'Найдено',closed:'Закрыта'}},
      en:{requests:'Requests',archive:'Archive',settings:'Settings',tagline:'Simple.\\nClear.\\nFor work.',newRequest:'+ New request',search:'Search by vehicle...',request:'Request',newTitle:'New request',edit:'Edit',save:'Save',delete:'Delete',date:'Date',brand:'Vehicle make',condition:'Condition',year:'Year',color:'Color',available:'Available',status:'Status',yes:'Yes',no:'No',newCar:'New',used:'Used',photos:'Photos',videos:'Videos',addPhoto:'+ Add photos',addVideo:'+ Add videos',note:'Note',noteColor:'Note color',empty:'No requests yet',saved:'Request saved',deleted:'Request deleted',uploaded:'Attachment added',access:'Access code',signIn:'Sign in',loginText:'Private work records',logout:'Sign out',language:'Interface language',languageHelp:'Only the interface is translated; your records stay unchanged.',security:'Private access',securityHelp:'This system never imports website leads and uses separate record tables.',confirmDelete:'Delete the request and all attachments?',statusNames:{new:'New',working:'In progress',found:'Found',closed:'Closed'}},
      zh:{requests:'工作单',archive:'归档',settings:'设置',tagline:'简单。\\n清晰。\\n高效工作。',newRequest:'+ 新建工作单',search:'按车辆品牌搜索...',request:'工作单',newTitle:'新建工作单',edit:'编辑',save:'保存',delete:'删除',date:'日期',brand:'汽车品牌',condition:'车况',year:'年份',color:'颜色',available:'有现车',status:'状态',yes:'有',no:'无',newCar:'新车',used:'二手车',photos:'照片',videos:'视频',addPhoto:'+ 添加照片',addVideo:'+ 添加视频',note:'备注',noteColor:'备注颜色',empty:'暂无工作单',saved:'工作单已保存',deleted:'工作单已删除',uploaded:'附件已添加',access:'访问码',signIn:'登录',loginText:'私人工作记录',logout:'退出',language:'界面语言',languageHelp:'仅翻译界面，您的记录内容不会改变。',security:'私人访问',securityHelp:'本系统不会导入网站客户线索，并使用独立的数据表。',confirmDelete:'删除工作单及所有附件？',statusNames:{new:'新建',working:'处理中',found:'已找到',closed:'已关闭'}}
    };
    const icons={
      requests:'<svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M16 3v4h4M8 11h8M8 15h8"/></svg>',
      archive:'<svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/></svg>',
      settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.8-1L14.4 3h-4.8l-.4 3.1a8 8 0 0 0-1.8 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2L3 14.5 5 18l2.4-1a8 8 0 0 0 1.8 1l.4 3h4.8l.4-3a8 8 0 0 0 1.8-1l2.4 1 2-3.5-2.1-1.5a7 7 0 0 0 .1-1z"/></svg>',
      search:'<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>',
      edit:'<svg viewBox="0 0 24 24"><path d="m4 20 4.2-1 11-11a2.1 2.1 0 0 0-3-3l-11 11zM14.8 6.2l3 3"/></svg>',
      trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>'
    };
    const state={token:localStorage.getItem('inavto_crm_token')||'',locale:localStorage.getItem('inavto_crm_locale')||'ru',page:'requests',q:'',items:[],selected:null,attachments:[],editing:false,pending:[]};
    const el=id=>document.getElementById(id),t=key=>I[state.locale]?.[key]??I.ru[key]??key;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const formatDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString(state.locale==='zh'?'zh-CN':state.locale):'—';
    const today=()=>new Date().toISOString().slice(0,10),statusName=id=>t('statusNames')[id]||id;
    const statusPill=id=>`<span class="pill status-${esc(id)}">${esc(statusName(id))}</span>`;
    const requestUrl=()=>`/requests?archive=${state.page==='archive'?'1':'0'}&q=${encodeURIComponent(state.q)}`;
    async function api(path,options={}){const response=await fetch('/api/crm'+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token,...options.headers}});if(!response.ok){let message='HTTP '+response.status;try{message=(await response.json()).error||message}catch{}throw new Error(message)}return response.status===204?null:response.json()}
    function toast(message){const node=el('toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.add('hidden'),2600)}
    function showLogin(error=''){el('login').classList.remove('hidden');el('app').innerHTML='';el('loginText').textContent=t('loginText');el('tokenInput').placeholder=t('access');el('loginButton').textContent=t('signIn');el('loginError').textContent=error}
    function navButton(page,icon){return `<button data-page="${page}" class="${state.page===page?'active':''}">${icons[icon]}<span>${t(page)}</span></button>`}
    async function load(preserve=false){try{state.items=await api(requestUrl());if(!preserve||!state.items.some(x=>x.id===state.selected))state.selected=state.items[0]?.id??null;state.attachments=state.selected?await api('/requests/'+state.selected+'/attachments'):[];state.editing=false;el('login').classList.add('hidden');render()}catch(error){state.token='';localStorage.removeItem('inavto_crm_token');showLogin(error.message)}}
    async function choose(id){state.selected=id;state.editing=false;state.attachments=await api('/requests/'+id+'/attachments');render()}
    function current(){return state.selected==='new'?freshRequest():state.items.find(x=>x.id===state.selected)}
    function freshRequest(){return {id:'new',request_date:today(),brand:'',condition:'new',year:new Date().getFullYear(),color:'',available:0,status:'new',note:'',note_color:'yellow',isNew:true}}
    function render(){document.documentElement.lang=state.locale==='zh'?'zh-CN':state.locale;document.title='INAVTO ASIA — '+t(state.page);const nav=`<aside class="side"><div class="brand"><i class="brand-mark"></i><div class="brand-name">INAVTO <b>ASIA</b></div><div class="brand-sub">Подбор автомобилей из Китая</div></div><nav class="nav">${navButton('requests','requests')}${navButton('archive','archive')}</nav><div class="side-spacer"></div><nav class="nav">${navButton('settings','settings')}</nav><div class="side-foot"><strong>INAVTO ASIA</strong>${esc(t('tagline')).replace(/\\n/g,'<br>')}</div></aside>`;const header=`<header class="top"><div class="page-title">${t(state.page)}</div>${state.page!=='settings'?`<button class="new-button" id="newRequest">${t('newRequest')}</button><label class="search-wrap">${icons.search}<input class="search" id="search" value="${esc(state.q)}" placeholder="${t('search')}"></label>`:''}<div class="top-spacer"></div><div class="avatar">ИА</div><span class="user">INAVTO</span><button class="logout" id="logout" title="${t('logout')}">⌄</button></header>`;el('app').innerHTML=`<div class="app">${nav}<section class="workspace">${header}<main class="content">${state.page==='settings'?settingsPage():requestsPage()}</main></section></div>`;bind()}
    function requestsPage(){return `<div class="layout"><section class="list-panel"><table><thead><tr><th>№</th><th>${t('date')} ↓</th><th>${t('brand')}</th><th>${t('condition')}</th><th>${t('year')}</th><th>${t('color')}</th><th>${t('available')}</th><th>${t('status')}</th></tr></thead><tbody>${state.items.length?state.items.map(rowTemplate).join(''):`<tr><td colspan="8" class="empty">${t('empty')}</td></tr>`}</tbody></table></section>${detailPanel(current())}</div>`}
    function rowTemplate(x){return `<tr class="item-row ${x.id===state.selected?'selected':''}" data-id="${x.id}"><td class="number">${x.id}</td><td>${formatDate(x.request_date)}</td><td><strong>${esc(x.brand)}</strong></td><td>${x.condition==='used'?t('used'):t('newCar')}</td><td>${x.year||'—'}</td><td>${esc(x.color)||'—'}</td><td>${x.available?`<span class="pill yes">${t('yes')}</span>`:`<span class="pill no">${t('no')}</span>`}</td><td>${statusPill(x.status)}</td></tr>`}
    function detailPanel(item){if(!item)return `<aside class="detail"><div class="detail-head"><h2>${t('request')}</h2></div><div class="empty">${t('empty')}</div></aside>`;return state.editing||item.isNew?editPanel(item):viewPanel(item)}
    function viewPanel(x){const photo=state.attachments.filter(a=>a.kind==='photo'),video=state.attachments.filter(a=>a.kind==='video');return `<aside class="detail"><div class="detail-head"><h2>${t('request')} №${x.id}</h2><button class="new-button edit" id="editRequest">${icons.edit} ${t('edit')}</button><button class="icon-button" id="closeDetail">×</button></div><div class="detail-scroll"><div class="info-grid"><span>${t('date')}:</span><strong>${formatDate(x.request_date)}</strong><span>${t('brand')}:</span><strong>${esc(x.brand)}</strong><span>${t('condition')}:</span><strong>${x.condition==='used'?t('used'):t('newCar')}</strong><span>${t('year')}:</span><strong>${x.year}</strong><span>${t('color')}:</span><strong>${esc(x.color)||'—'}</strong><span>${t('available')}:</span><strong>${x.available?`<span class="pill yes">${t('yes')}</span>`:`<span class="pill no">${t('no')}</span>`}</strong><span>${t('status')}:</span><select class="status-select" id="quickStatus">${statusOptions(x.status)}</select></div><div class="divider"></div>${mediaSection('photo',photo)}<div class="divider"></div>${mediaSection('video',video)}<div class="divider"></div><div class="section-title"><span>${t('note')}</span><button class="icon-button" id="editNote">${icons.edit}</button></div><div class="note note-${x.note_color||'yellow'}">${esc(x.note)||'—'}</div></div><div class="detail-foot"><button class="delete" id="deleteRequest">${icons.trash} ${t('delete')}</button><button class="primary" id="quickSave">${t('save')}</button></div><input class="hidden" type="file" id="photoInput" accept="image/*" multiple><input class="hidden" type="file" id="videoInput" accept="video/*" multiple></aside>`}
    function mediaSection(kind,items){const isPhoto=kind==='photo',label=isPhoto?t('photos'):t('videos'),add=isPhoto?t('addPhoto'):t('addVideo'),visible=items.slice(0,isPhoto?5:3);return `<section><div class="section-title"><span>${label} (${items.length})</span><button class="add-media" data-add="${kind}">${add}</button></div><div class="media-grid ${isPhoto?'':'video-grid'}">${visible.map(mediaTemplate).join('')}${items.length>visible.length?`<div class="media more">+${items.length-visible.length}</div>`:''}${items.length===0?`<button class="media add-tile" data-add="${kind}">+</button>`:''}</div></section>`}
    function mediaTemplate(a){return `<button class="media" data-open="${a.id}">${a.kind==='photo'?`<img src="${a.data_url}" alt="">`:`<video src="${a.data_url}" preload="metadata"></video>`}</button>`}
    function editPanel(x){const photo=state.attachments.filter(a=>a.kind==='photo'),video=state.attachments.filter(a=>a.kind==='video');return `<aside class="detail"><form id="requestForm"><div class="detail-head"><h2>${x.isNew?t('newTitle'):t('request')+' №'+x.id}</h2><button type="button" class="icon-button" id="closeDetail">×</button></div><div class="detail-scroll"><div class="form-grid"><label class="field"><span>${t('date')}</span><input name="request_date" type="date" required value="${esc(x.request_date)}"></label><label class="field"><span>${t('year')}</span><input name="year" type="number" min="1900" max="2100" required value="${x.year||''}"></label><label class="field full"><span>${t('brand')}</span><input name="brand" required value="${esc(x.brand)}"></label><label class="field"><span>${t('condition')}</span><select name="condition"><option value="new" ${x.condition==='new'?'selected':''}>${t('newCar')}</option><option value="used" ${x.condition==='used'?'selected':''}>${t('used')}</option></select></label><label class="field"><span>${t('color')}</span><input name="color" value="${esc(x.color)}"></label><label class="field"><span>${t('available')}</span><select name="available"><option value="1" ${x.available?'selected':''}>${t('yes')}</option><option value="0" ${!x.available?'selected':''}>${t('no')}</option></select></label><label class="field"><span>${t('status')}</span><select name="status">${statusOptions(x.status)}</select></label></div><div class="divider"></div>${editMediaSection('photo',photo)}<div class="divider"></div>${editMediaSection('video',video)}<div class="divider"></div><div class="section-title"><span>${t('note')}</span><span>${t('noteColor')}</span></div><label class="field"><textarea name="note" class="note-${x.note_color||'yellow'}">${esc(x.note)}</textarea></label><input type="hidden" name="note_color" value="${x.note_color||'yellow'}"><div class="colors">${['yellow','blue','green','pink','violet'].map(c=>`<button type="button" class="color-choice ${(x.note_color||'yellow')===c?'active':''}" data-note-color="${c}"></button>`).join('')}</div></div><div class="detail-foot">${x.isNew?'<span></span>':`<button type="button" class="delete" id="deleteRequest">${icons.trash} ${t('delete')}</button>`}<button class="primary">${t('save')}</button></div><input class="hidden" type="file" id="photoInput" accept="image/*" multiple><input class="hidden" type="file" id="videoInput" accept="video/*" multiple></form></aside>`}
    function editMediaSection(kind,items){const isPhoto=kind==='photo',label=isPhoto?t('photos'):t('videos'),add=isPhoto?t('addPhoto'):t('addVideo'),pending=state.pending.filter(p=>p.kind===kind);return `<section><div class="section-title"><span>${label} (${items.length+pending.length})</span><button type="button" class="add-media" data-add="${kind}">${add}</button></div><div class="media-grid ${isPhoto?'':'video-grid'}">${items.map(a=>`<div class="media">${a.kind==='photo'?`<img src="${a.data_url}" alt="">`:`<video src="${a.data_url}" controls preload="metadata"></video>`}<button type="button" class="remove" data-remove="${a.id}">×</button></div>`).join('')}${pending.map((p,i)=>`<div class="media">${p.kind==='photo'?`<img src="${p.preview}" alt="">`:`<video src="${p.preview}" controls></video>`}<button type="button" class="remove" data-pending-remove="${i}">×</button></div>`).join('')}${items.length+pending.length===0?`<button type="button" class="media add-tile" data-add="${kind}">+</button>`:''}</div></section>`}
    function statusOptions(selected){return ['new','working','found','closed'].map(id=>`<option value="${id}" ${id===selected?'selected':''}>${statusName(id)}</option>`).join('')}
    function settingsPage(){return `<div class="settings"><section class="card"><h2>${t('language')}</h2><p>${t('languageHelp')}</p><div class="language">${[['ru','Русский'],['en','English'],['zh','中文']].map(([id,label])=>`<button data-locale="${id}" class="${state.locale===id?'active':''}">${label}</button>`).join('')}</div></section><section class="card"><h2>${t('security')}</h2><p>${t('securityHelp')}</p><button class="delete" id="settingsLogout">${t('logout')}</button></section></div>`}
    function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=async()=>{state.page=b.dataset.page;state.q='';state.selected=null;state.pending=[];state.editing=false;if(state.page==='settings')render();else await load()});el('logout')?.addEventListener('click',logout);el('settingsLogout')?.addEventListener('click',logout);document.querySelectorAll('[data-locale]').forEach(b=>b.onclick=()=>{state.locale=b.dataset.locale;localStorage.setItem('inavto_crm_locale',state.locale);render()});el('newRequest')?.addEventListener('click',()=>{state.page='requests';state.selected='new';state.attachments=[];state.pending=[];state.editing=true;render()});document.querySelectorAll('[data-id]').forEach(row=>row.onclick=()=>choose(Number(row.dataset.id)));el('search')?.addEventListener('input',e=>{state.q=e.target.value;clearTimeout(bind.searchTimer);bind.searchTimer=setTimeout(()=>load(),220)});el('closeDetail')?.addEventListener('click',()=>{state.selected=null;state.editing=false;state.pending=[];render()});el('editRequest')?.addEventListener('click',()=>{state.editing=true;render()});el('editNote')?.addEventListener('click',()=>{state.editing=true;render()});el('quickSave')?.addEventListener('click',saveQuick);el('requestForm')?.addEventListener('submit',saveForm);el('deleteRequest')?.addEventListener('click',deleteRequest);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>el(b.dataset.add+'Input').click());el('photoInput')?.addEventListener('change',e=>selectFiles('photo',e.target.files));el('videoInput')?.addEventListener('change',e=>selectFiles('video',e.target.files));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeAttachment(Number(b.dataset.remove)));document.querySelectorAll('[data-pending-remove]').forEach(b=>b.onclick=()=>{state.pending.splice(Number(b.dataset.pendingRemove),1);render()});document.querySelectorAll('[data-note-color]').forEach(b=>b.onclick=()=>{const form=el('requestForm');form.elements.note_color.value=b.dataset.noteColor;form.elements.note.className='note-'+b.dataset.noteColor;document.querySelectorAll('[data-note-color]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMedia(Number(b.dataset.open)))}
    function logout(){localStorage.removeItem('inavto_crm_token');state.token='';showLogin()}
    async function saveQuick(){const x=current();try{await api('/requests/'+x.id,{method:'PUT',body:JSON.stringify({...x,status:el('quickStatus').value})});toast(t('saved'));await load(true)}catch(error){toast(error.message)}}
    async function saveForm(event){event.preventDefault();const body=Object.fromEntries(new FormData(event.currentTarget).entries());body.available=body.available==='1';try{let saved;if(state.selected==='new'){saved=await api('/requests',{method:'POST',body:JSON.stringify(body)});state.selected=saved.id}else saved=await api('/requests/'+state.selected,{method:'PUT',body:JSON.stringify(body)});await uploadPending(saved.id);toast(t('saved'));await load(true)}catch(error){toast(error.message)}}
    async function deleteRequest(){if(!confirm(t('confirmDelete')))return;try{await api('/requests/'+state.selected,{method:'DELETE'});state.selected=null;state.attachments=[];toast(t('deleted'));await load()}catch(error){toast(error.message)}}
    async function selectFiles(kind,fileList){const files=[...fileList],max=kind==='photo'?12*1024*1024:50*1024*1024;for(const file of files){if(file.size>max){toast(kind==='photo'?'Фото больше 12 МБ':'Видео больше 50 МБ');continue}if(state.selected==='new')state.pending.push({kind,file,preview:URL.createObjectURL(file)});else try{await uploadFile(state.selected,kind,file)}catch(error){toast(error.message)}}if(state.selected!=='new'){state.attachments=await api('/requests/'+state.selected+'/attachments');state.items=await api(requestUrl())}render()}
    async function uploadPending(id){for(const item of state.pending)await uploadFile(id,item.kind,item.file);state.pending=[]}
    function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
    async function uploadFile(id,kind,file){const data_url=await readFile(file);await api('/requests/'+id+'/attachments',{method:'POST',body:JSON.stringify({kind,filename:file.name,mime_type:file.type,data_url})});toast(t('uploaded'))}
    async function removeAttachment(id){try{await api('/attachments/'+id,{method:'DELETE'});state.attachments=await api('/requests/'+state.selected+'/attachments');render()}catch(error){toast(error.message)}}
    function openMedia(id){const a=state.attachments.find(x=>x.id===id);if(!a)return;el('lightbox').innerHTML=`<div class="lightbox" id="lightboxPanel"><button id="closeLightbox">×</button>${a.kind==='photo'?`<img src="${a.data_url}" alt="">`:`<video src="${a.data_url}" controls autoplay></video>`}</div>`;el('closeLightbox').onclick=()=>el('lightbox').innerHTML='';el('lightboxPanel').onclick=e=>{if(e.target.id==='lightboxPanel')el('lightbox').innerHTML=''}}
    el('loginForm').onsubmit=async event=>{event.preventDefault();state.token=el('tokenInput').value.trim();localStorage.setItem('inavto_crm_token',state.token);await load()};
    showLogin();if(state.token)load();
  </script>
</body>
</html>
