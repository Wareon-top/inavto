<body data-page="car">

  <section class="page-hero" style="padding-bottom:24px">
    <div class="container">
      <div class="breadcrumbs" id="crumbs"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="calc-layout" id="car-wrap"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="section-head"><h2 class="h2">Похожие автомобили</h2></div>
      <div class="cars-grid" id="similar"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/specs.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    window.INAVTO_PAGE_INIT = function () {
      const A = window.INAVTO;
      const slug = new URLSearchParams(location.search).get('slug');
      const car = A.CARS.find(c => c.slug === slug) || A.CARS[0];
      const from = 'из Китая';
      const catUrl = 'catalog.html';
      const catName = 'Авто из Китая';
      const used = car.cond === 'used';
      const stock = !!car.stock;
      const stateNote = stock ? 'в наличии в России' : used ? 'с пробегом' : 'новый автомобиль';

      document.title = car.name + ' купить под заказ ' + from + ' — цена под ключ | INAVTO ASIA';
      document.getElementById('crumbs').innerHTML =
        '<a href="index.html">Главная</a> / <a href="' + catUrl + '">' + catName + '</a> / ' + car.name;

      const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      const specs = [['Мощность', car.power], ['Привод', car.drive]];
      if (car.range !== '—') specs.push(['Запас хода', car.range]);
      if (car.battery !== '—') specs.push(['Батарея', car.battery]);
      if (car.mileage && (used || stock)) specs.push(['Пробег', Number(car.mileage).toLocaleString('ru-RU') + ' км']);
      specs.push(['Год', car.year]);
      if (stock) {
        specs.unshift(['Город', car.stockCity || 'Россия']);
        if (car.vin) specs.push(['VIN', car.vin]);
      }

      const cnyLine = car.priceCny ? '<div class="price-cny">≈ ¥ ' + car.priceCny.toLocaleString('ru-RU') + ' цена в Китае</div>' : '';

      /* Подробная карточка (если заполнена в админке) вместо короткого блока */
      const sheet = A.specSheetHTML ? A.specSheetHTML(car, A.localDesc(car)) : '';
      const specsBlock = sheet || `
          <p class="lead" style="font-size:16px;margin-top:12px">${A.localDesc(car)}</p>
          <div class="divider-label" style="margin:28px 0 14px">Характеристики</div>
          ${A.specGrid(specs)}`;

      document.getElementById('car-wrap').innerHTML = `
        <div>
          ${A.carGallery(car)}
          <h1 class="h2" style="margin:22px 0 4px">${car.name}</h1>
          ${A.carPills(car)}
          ${specsBlock}
        </div>
        <div class="calc-panel calc-result reveal">
          <div class="badge badge-green" style="margin-bottom:14px">${stock ? 'в наличии — можно забрать сегодня' : 'доступен к заказу'}</div>
          <div class="muted" style="font-size:13.5px">${stock ? 'Цена — автомобиль уже в России' : 'Цена «под ключ» с доставкой и растаможкой'}</div>
          <div class="calc-total" style="padding-top:6px"><span></span><b>от ${car.price.toFixed(1).replace('.', ',')} млн ₽</b></div>
          ${cnyLine}
          ${stock
            ? `<div class="calc-row" style="margin-top:14px"><span>Срок передачи</span><b>сегодня</b></div>
               <div class="calc-row"><span>Где находится</span><b>${car.stockCity || 'Россия'}</b></div>`
            : `<div class="calc-row" style="margin-top:14px"><span>Срок доставки</span><b>30–60 дней</b></div>
               <div class="calc-row"><span>Фиксация цены</span><b>в договоре</b></div>`}
          <div class="calc-row" style="border:none"><span>Оплата</span><b>по инвойсу через банк</b></div>
          <form class="form-grid" data-lead-form="${stock ? 'Бронь: ' + car.name : 'Заявка на ' + car.name}" data-brand="${car.name}" style="margin-top:18px">
            <div class="form-field"><input name="name" placeholder="Ваше имя" required></div>
            <div class="form-field"><input name="phone" type="tel" placeholder="+7 (___) ___-__-__" required></div>
            <button class="btn btn-red btn-block" type="submit">${stock ? 'Забронировать' : 'Узнать точную цену'}</button>
            <div class="form-note">${stock ? 'Закрепим автомобиль за вами и свяжемся в ближайшее время. Нажимая кнопку, вы соглашаетесь с' : 'Пришлём актуальный расчёт с учётом комплектации и вашего города. Нажимая кнопку, вы соглашаетесь с'} <a href="privacy.html">политикой конфиденциальности</a>.</div>
          </form>
          <div class="price-trust">
            <span>${CHECK}Договор с фиксацией цены и сроков</span>
            <span>${CHECK}Страхование груза на весь путь</span>
            <span>${CHECK}Проверка автомобиля до оплаты</span>
          </div>
        </div>`;

      document.getElementById('similar').innerHTML = A.CARS
        .filter(c => c.slug !== car.slug && (c.country === car.country && (c.body === car.body || c.brand === car.brand)))
        .slice(0, 3).map(A.carCard).join('');
    };
  </script>
  <script src="js/main.js"></script>
</body>
</html>
