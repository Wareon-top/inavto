    function localeButtons(){return ['ru','zh','en'].map(l=>`<button type="button" class="${state.locale===l?'on':''}" data-locale="${l}">${l==='ru'?'RU':l==='zh'?'中文':'EN'}</button>`).join('')}
    function navButton(id,ico){return `<button class="${state.page===id?'on':''}" data-page="${id}">${icon(ico)}<span>${t(id)}</span></button>`}
    function render(){document.documentElement.lang=state.locale==='zh'?'zh-CN':state.locale;document.title=`INAVTO ASIA — ${t(state.page)}`;$('app').innerHTML=`<aside class="side"><div class="brand"><i class="brand-mark"></i><span>INAVTO <b>ASIA</b></span></div><nav class="side-nav">${navButton('leads','lead')}${navButton('pipeline','pipe')}${navButton('publications','chart')}${navButton('archive','archive')}</nav><div class="side-spacer"></div><nav class="side-nav">${navButton('settings','settings')}</nav><div class="side-bottom"><strong>INAVTO ASIA</strong>${esc(t('tagline')).replace(/\n/g,'<br>')}</div></aside><section class="workspace"><header class="top">${header()}</header><main class="main">${page()}</main></section>`;bind()}
    function header(){const pageTitle=state.page==='archive'?t('archiveTitle'):t(state.page);const create=state.page==='publications'?`<button class="primary" id="newPub">${t('newPublication')}</button>`:state.page==='settings'?'':`<button class="primary" id="newLead">${t('newLead')}</button>`;return `<div class="page-title">${pageTitle}</div>${state.page!=='settings'?`<input class="search" id="search" value="${esc(state.search)}" placeholder="${t('search')}">`:''}<div class="top-actions">${create}<button class="ghost" id="refresh">${t('refresh')}</button><div class="locale">${localeButtons()}</div><div class="avatar">ИА</div><span class="user-name">INAVTO</span><button class="icon-btn" id="logout" title="${t('logout')}">${icon('close')}</button></div>`}
    function activeLeads(){let items=state.leads;if(state.page==='archive')items=items.filter(x=>['contract','lost','later'].includes(x.stage));if(state.search){const q=state.search.toLowerCase();items=items.filter(x=>[x.name,x.contact,x.model,x.source,x.budget].join(' ').toLowerCase().includes(q))}return items}
    function page(){if(state.page==='leads'||state.page==='archive')return leadPage();if(state.page==='pipeline')return pipelinePage();if(state.page==='publications')return publicationsPage();return settingsPage()}
    function leadPage(){const items=activeLeads(),selected=state.selected==='new'?freshLead():state.leads.find(x=>x.id===state.selected);return `<div class="lead-layout"><div class="table-card"><table class="data-table"><thead><tr><th>${t('number')}</th><th>${t('created')}</th><th>${t('client')}</th><th>${t('model')}</th><th>${t('source')}</th><th>${t('budget')}</th><th>${t('stage')}</th></tr></thead><tbody>${items.length?items.map(l=>`<tr data-lead="${l.id}" class="${l.id===state.selected?'selected':''}"><td class="id">${l.id}</td><td>${date(l.created_at)}</td><td><span class="strong">${esc(l.name)}</span><br><span class="soft">${esc(l.contact)}</span></td><td>${esc(l.model||'—')}</td><td class="soft">${esc(l.source||t('notLinked'))}</td><td>${esc(l.budget||'—')}</td><td><span class="pill s-${l.stage}">${stageText(l.stage)}</span></td></tr>`).join(''):`<tr><td colspan="7" class="empty">${t('empty')}</td></tr>`}</tbody></table></div>${leadDetail(selected)}</div>`}
    function freshLead(){return {id:'new',name:'',contact:'',model:'',source:'',budget:'',stage:'new',next_action:'',next_action_at:'',manager_note:'',publication_id:'',isNew:true}}
    function leadDetail(l){if(!l)return `<aside class="detail"><div class="detail-head"><h2>${t('lead')}</h2></div><div class="detail-inner"><p class="soft">${t('empty')}</p></div></aside>`;const opts=state.stages.map(s=>`<option value="${s.id}" ${l.stage===s.id?'selected':''}>${stageText(s.id)}</option>`).join('');const pubs=`<option value="">${t('notLinked')}</option>`+state.pubs.map(p=>`<option value="${p.id}" ${l.publication_id==p.id?'selected':''}>${esc(date(p.published_at)+' · '+p.platform+' · '+p.topic)}</option>`).join('');return `<aside class="detail"><form id="leadForm"><div class="detail-head"><h2>${l.isNew?t('leadNew'):t('lead')+' #'+l.id}</h2>${l.isNew?'':`<button type="button" class="icon-btn" id="copyContact" title="${t('contact')}">${icon('copy')}</button>`}</div><div class="detail-inner"><div class="field-grid"><div class="field"><label>${t('name')}</label><input name="name" required value="${esc(l.name)}"></div><div class="field"><label>${t('contact')}</label><input name="contact" required value="${esc(l.contact)}"></div><div class="field full"><label>${t('model')}</label><input name="model" value="${esc(l.model)}"></div><div class="field"><label>${t('source')}</label><input name="source" value="${esc(l.source)}"></div><div class="field"><label>${t('budget')}</label><input name="budget" value="${esc(l.budget)}"></div><div class="field full"><label>${t('stage')}</label><select name="stage">${opts}</select></div></div><div class="section-title"><span>${t('next')}</span></div><div class="field-grid"><div class="field full"><input name="next_action" value="${esc(l.next_action)}" placeholder="${t('next')}"></div><div class="field"><label>${t('deadline')}</label><input name="next_action_at" type="date" value="${esc(l.next_action_at)}"></div><div class="field"><label>${t('linked')}</label><select name="publication_id">${pubs}</select></div></div><div class="quick"><button type="button" data-deadline="0">${t('today')}</button><button type="button" data-deadline="1">${t('tomorrow')}</button></div><div class="section-title"><span>${t('note')}</span></div><div class="field"><textarea name="manager_note" placeholder="${t('note')}">${esc(l.manager_note)}</textarea></div></div><div class="detail-foot">${l.isNew?'':l.is_website_lead?'':`<button type="button" class="delete" id="deleteLead">${icon('trash')} ${t('delete')}</button>`}<button class="primary">${t('save')}</button></div></form></aside>`}
    function pipelinePage(){const open=state.stages.filter(s=>!['lost','later'].includes(s.id));return `<div class="toolbar"><span class="stat">${t('work')} · ${state.leads.filter(l=>!['lost','later','contract'].includes(l.stage)).length} ${t('active').toLowerCase()}</span></div><div class="kanban-wrap"><div class="kanban">${open.map(s=>{const leads=state.leads.filter(l=>l.stage===s.id);return `<section class="kanban-col" data-stage="${s.id}"><div class="kanban-head"><span>${stageText(s.id)}</span><span class="kanban-count">${leads.length}</span></div>${leads.map(l=>`<button class="lead-card" draggable="true" data-drag="${l.id}"><strong>${esc(l.name)}</strong><small>${esc(l.model||l.contact)}</small>${l.next_action?`<span class="mini">${esc(l.next_action)}</span>`:''}</button>`).join('')}<small class="soft">${t('moveHint')}</small></section>`}).join('')}</div></div>`}
    function publicationsPage(){const p=state.pubs.filter(p=>!state.search||[p.platform,p.topic,p.note].join(' ').toLowerCase().includes(state.search.toLowerCase()));return `<div class="toolbar"><span class="stat">${t('stats')}: ${p.length}</span></div><div class="table-card"><table class="data-table"><thead><tr><th>${t('published')}</th><th>${t('platform')}</th><th>${t('topic')}</th><th>${t('views')}</th><th>${t('clicks')}</th><th>${t('dialogs')}</th><th>${t('quotes')}</th><th>${t('contacts')}</th><th>${t('contracts')}</th><th>${t('cost')}</th></tr></thead><tbody>${p.length?p.map(x=>`<tr data-pub="${x.id}"><td>${date(x.published_at)}</td><td class="strong">${esc(x.platform)}</td><td>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener" class="id">${esc(x.topic)}</a>`:esc(x.topic)}</td><td>${n(x.views)}</td><td>${n(x.clicks)}</td><td>${n(x.dialogs)}</td><td>${n(x.quotes)}</td><td>${n(x.contacts)}</td><td>${n(x.contracts)}</td><td>${n(x.cost)} ₽</td></tr>`).join(''):`<tr><td colspan="10" class="empty">${t('empty')}</td></tr>`}</tbody></table></div>`}
    function settingsPage(){return `<div class="settings-grid"><section class="settings-card"><h2>${t('language')}</h2><p>${t('languageText')}</p><div class="lang-options">${localeButtons()}</div></section><section class="settings-card"><h2>${t('security')}</h2><p>${t('securityText')}</p></section><section class="settings-card"><h2>INAVTO ASIA CRM</h2><p>v2.0 · ${t('stats')}: ${state.leads.length}</p></section></div>`}
    function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.search='';render()});document.querySelectorAll('[data-locale]').forEach(b=>b.onclick=()=>{state.locale=b.dataset.locale;localStorage.setItem('inavto_crm_locale',state.locale);if(state.token){showApp();render()}else showLogin()});$('logout')?.addEventListener('click',()=>{localStorage.removeItem('inavto_crm_token');state.token='';showLogin()});$('refresh')?.addEventListener('click',load);$('search')?.addEventListener('input',e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)});$('newLead')?.addEventListener('click',()=>{state.page='leads';state.search='';state.selected='new';render()});$('newPub')?.addEventListener('click',()=>openPub());document.querySelectorAll('[data-lead]').forEach(row=>row.onclick=()=>{state.selected=+row.dataset.lead;render()});document.querySelectorAll('[data-pub]').forEach(row=>row.onclick=()=>openPub(state.pubs.find(p=>p.id==row.dataset.pub)));bindLeadForm();bindDrag()}
    function leadBody(form){const body=Object.fromEntries(new FormData(form).entries());body.publication_id=body.publication_id||null;return body}
    function bindLeadForm(){const form=$('leadForm');if(!form)return;form.onsubmit=async e=>{e.preventDefault();try{const body=leadBody(form);if(state.selected==='new')await api('/leads',{method:'POST',body:JSON.stringify(body)});else await api('/leads/'+state.selected,{method:'PUT',body:JSON.stringify(body)});state.selected=null;notice(t('saved'));await load()}catch(err){notice(err.message)}};$('copyContact')?.addEventListener('click',async()=>{const l=state.leads.find(x=>x.id===state.selected);try{await navigator.clipboard.writeText(l.contact);notice(t('copied'))}catch{}});$('deleteLead')?.addEventListener('click',async()=>{if(!confirm(t('delete')+'?'))return;try{await api('/leads/'+state.selected,{method:'DELETE'});state.selected=null;notice(t('deleted'));await load()}catch(err){notice(err.message)}});document.querySelectorAll('[data-deadline]').forEach(b=>b.onclick=()=>{const d=new Date();d.setDate(d.getDate()+Number(b.dataset.deadline));form.elements.next_action_at.value=d.toISOString().slice(0,10)})}
    function bindDrag(){document.querySelectorAll('[data-drag]').forEach(card=>{card.addEventListener('click',()=>{state.selected=+card.dataset.drag;state.page='leads';render()});card.addEventListener('dragstart',e=>{card.classList.add('dragging');e.dataTransfer.setData('text/plain',card.dataset.drag)});card.addEventListener('dragend',()=>card.classList.remove('dragging'))});document.querySelectorAll('.kanban-col').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('dragover')});col.addEventListener('dragleave',()=>col.classList.remove('dragover'));col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('dragover');const l=state.leads.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(!l||l.stage===col.dataset.stage)return;try{await api('/leads/'+l.id,{method:'PUT',body:JSON.stringify({...l,stage:col.dataset.stage})});notice(t('saved'));await load()}catch(err){notice(err.message)}})})}
    function openPub(p=null){state.modal={data:p||{published_at:new Date().toISOString().slice(0,10),platform:'',topic:'',link:'',views:0,clicks:0,dialogs:0,quotes:0,contacts:0,contracts:0,cost:0,note:''}};renderModal()}
    function renderModal(){const x=state.modal?.data;if(!x){$('modalRoot').innerHTML='';return}$('modalRoot').innerHTML=`<div class="modal"><form class="modal-card" id="pubForm"><div class="modal-head"><h2>${x.id?t('pubEdit'):t('pubNew')}</h2><button type="button" class="icon-btn" id="closeModal">${icon('close')}</button></div><div class="modal-body"><div class="field-grid"><div class="field"><label>${t('published')}</label><input name="published_at" type="date" required value="${esc(x.published_at)}"></div><div class="field"><label>${t('platform')}</label><input name="platform" required value="${esc(x.platform)}"></div><div class="field full"><label>${t('topic')}</label><input name="topic" required value="${esc(x.topic)}"></div><div class="field full"><label>${t('link')}</label><input name="link" type="url" value="${esc(x.link)}"></div>${['views','clicks','dialogs','quotes','contacts','contracts','cost'].map(k=>`<div class="field"><label>${t(k)}</label><input name="${k}" type="number" min="0" value="${Number(x[k])||0}"></div>`).join('')}<div class="field full"><label>${t('note')}</label><textarea name="note">${esc(x.note)}</textarea></div></div></div><div class="modal-foot">${x.id?`<button type="button" class="delete" id="deletePub">${t('delete')}</button>`:''}<button type="button" class="ghost" id="closeModal2">${t('cancel')}</button><button class="primary">${t('save')}</button></div></form></div>`;$('closeModal').onclick=$('closeModal2').onclick=()=>{state.modal=null;renderModal()};$('pubForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.currentTarget).entries());try{await api('/publications'+(x.id?'/'+x.id:''),{method:x.id?'PUT':'POST',body:JSON.stringify(body)});state.modal=null;renderModal();notice(t('saved'));await load()}catch(err){notice(err.message)}};$('deletePub')?.addEventListener('click',async()=>{if(!confirm(t('delete')+'?'))return;try{await api('/publications/'+x.id,{method:'DELETE'});state.modal=null;renderModal();await load()}catch(err){notice(err.message)}})}
    function notice(message){const el=$('toast');el.textContent=message;el.classList.add('on');clearTimeout(window.crmToast);window.crmToast=setTimeout(()=>el.classList.remove('on'),2600)}
    $('loginForm').onsubmit=async e=>{e.preventDefault();state.token=$('token').value.trim();if(!state.token)return;await load();if(state.token)localStorage.setItem('inavto_crm_token',state.token)};
    showLogin();if(state.token)load();
  </script>
</body></html>
