<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты INAVTO ASIA — телефон, Telegram, WhatsApp</title>
  <meta name="description" content="Свяжитесь с INAVTO ASIA: телефон, Telegram, WhatsApp, электронная почта. Консультации по подбору и доставке автомобилей из Китая ежедневно с 9:00 до 21:00.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="INAVTO ASIA">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Контакты INAVTO ASIA — телефон, Telegram, WhatsApp">
  <meta property="og:description" content="Свяжитесь с INAVTO ASIA: телефон, Telegram, WhatsApp, электронная почта. Консультации по подбору и доставке автомобилей из Китая ежедневно с 9:00 до 21:00.">
  <meta property="og:url" content="https://inavtoasia.ru/kontakty.html">
  <meta property="og:image" content="https://inavtoasia.ru/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="kontakty">

  <section class="page-hero">
    <div class="container">
      <div class="breadcrumbs"><a href="index.html">Главная</a> / Контакты</div>
      <h1 class="h1">Контакты</h1>
      <p class="lead" style="margin-top:14px;max-width:640px">Отвечаем ежедневно с 9:00 до 21:00 по московскому времени. Быстрее всего — в Telegram.</p>
    </div>
  </section>

  <section class="section" style="padding-top:16px">
    <div class="container">
      <div class="calc-layout">
        <div class="grid grid-2" id="contact-cards" style="align-content:start"></div>
        <div class="calc-panel reveal">
          <h3 class="h3" style="margin-bottom:8px">Заказать обратный звонок</h3>
          <p class="muted" style="font-size:14px;margin-bottom:18px">Оставьте номер — перезвоним в удобное время и ответим на все вопросы.</p>
          <form class="form-grid" data-lead-form="Обратный звонок">
            <div class="form-field"><label>Имя</label><input name="name" placeholder="Как к вам обращаться" required></div>
            <div class="form-field"><label>Телефон</label><input name="phone" type="tel" placeholder="+7 (___) ___-__-__" required></div>
            <div class="form-field"><label>Как с вами связаться?</label><select name="messenger">
              <option>Звонок по телефону</option><option>Telegram</option><option>WhatsApp</option>
            </select></div>
            <div class="form-field"><label>Комментарий (необязательно)</label><textarea name="comment" rows="3" placeholder="Например: интересует Lixiang L7, город Казань"></textarea></div>
            <button class="btn btn-red btn-block" type="submit">Жду звонка</button>
            <div class="form-note">Нажимая кнопку, вы соглашаетесь с <a href="privacy.html">политикой конфиденциальности</a>.</div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    window.INAVTO_PAGE_INIT = function () {
      const A = window.INAVTO, I = A.ICONS, C = A.CONTACTS;
      const cards = [
        [I.phone, 'Телефон', C.phone, C.phoneHref],
        [I.tg, 'Telegram', 'Написать в чат', C.telegram],
        [I.wa, 'WhatsApp', 'Написать в чат', C.whatsapp],
        [I.doc, 'Почта', C.email, 'mailto:' + C.email],
      ];
      document.getElementById('contact-cards').innerHTML = cards.map(c =>
        '<a class="feature reveal" href="' + c[3] + '"' + (c[3].startsWith('http') ? ' target="_blank" rel="noopener"' : '') + '>' +
        '<div class="icon">' + c[0] + '</div><h3>' + c[1] + '</h3><p>' + c[2] + '</p></a>').join('');
    };
  </script>
  <script src="js/main.js"></script>
</body>
</html>
