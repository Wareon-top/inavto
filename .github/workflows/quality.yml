name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Test backend security
        run: npm test
        working-directory: backend
      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

      - name: Install and build Mini App
        run: npm ci && npm audit --omit=dev --audit-level=high && npm run build
        working-directory: frontend

      - name: Install and build design prototype
        run: npm ci && npm run build
        working-directory: stones

      - name: Validate JavaScript and deploy scripts
        run: |
          find backend/src site/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          bash -n deploy/install.sh
          bash -n deploy/update.sh
